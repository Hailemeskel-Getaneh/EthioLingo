name: Mobile App CI

on:
  pull_request:
    branches: [ dev ]
    paths:
      - 'EthioLingoFront/**'  

jobs:
  lint-and-test:
    runs-on: windows-latest  
    
    defaults:
      run:
        working-directory: EthioLingoFront  
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pathEthioLingoFront/package-lock.json
          
      - name: Install dependencies
        run: npm ci  
        
      - name: Lint
        run: npm run lint  
        
      # - name: Run tests
      #   run: npm test  # Uncomment when adding tests
