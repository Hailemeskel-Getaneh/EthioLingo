name: Backend CI

on:
  pull_request:
    branches: [ dev ]  
    paths:
      - 'backend/**'  

jobs:
  lint-and-test:
    runs-on: windows-latest  
    
    defaults:
      run:
        working-directory: backend  
        
    steps:
      - name: Checkout code  
        uses: actions/checkout@v4  
        
      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:
          node-version: '20'
          cache: 'npm' 
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies  
        run: npm ci 
        
      - name: Lint  
        run: npm run lint  
        
      # - name: Run tests  
      #   run: npm test  # Run unit tests (currently commented out)
        
      # - name: Run e2e tests  
      #   run: npm run test:e2e  # Run end-to-end tests (commented out)
