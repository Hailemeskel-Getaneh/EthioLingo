name: Mobile App Main PR Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'EthioLingoFront/**' 

jobs:
  validate:
    runs-on: windows-latest 
    
    defaults:
      run:
        working-directory: EthioLingoFront  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pathEthioLingoFront/package-lock.json
          
      - name: Install dependencies
        run: npm ci 
        
      - name: Lint
        run: npm run lint  
        
      - name: Run tests with coverage
        run: npm run test -- --coverage  
        
      - name: Install Java & Android SDK
        uses: android-actions/setup-android@v3  

      - name: Install Gradle dependencies
        run: cd android && gradlew dependencies

      - name: Build Android APK
        run: cd android && gradlew assembleRelease  
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: EthioLingoFront/android/app/build/outputs/apk/release/app-release.apk  
